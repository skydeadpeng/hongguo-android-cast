          def audit(a):
              p = root / (a['tag']+'--'+a['name'])
              env = {'PATH':os.environ['PATH']}
              cmd=['curl','--disable','--noproxy','*','--location','--fail','--silent','--show-error','--proto','=https','--proto-redir','=https','--connect-timeout','15','--max-time','150','--output',str(p),'--write-out','%{http_code}',a['url']]
